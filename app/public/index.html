<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GreenLeaf English Academy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F0FDF4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #166534;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(22, 101, 52, 0.2);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      color: #4ADE80;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #DCFCE7;
      border-top-color: #22C55E;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="leafy/hero_wave.webp" alt="GreenLeaf" class="logo" />
  <h1>GreenLeaf</h1>
  <p>Grow Beyond</p>
  <div class="spinner"></div>
</body>
</html>
